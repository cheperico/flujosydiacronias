<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujos · Textos (TD)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --escala: clamp(21px, calc(min(100vw, 100vh) * 0.042), 69px);
    --bg:#000; --fg:#fff; --fg-muted:#aaa;
  }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: var(--bg);
  }
  body {
    font-size: var(--escala);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--fg);
    line-height: 1.7;
  }
  #textos {
    display:flex; flex-direction:column;
    justify-content:center;
    width:100%; height:100%;
    overflow:hidden;
    padding: 0 2em;
  }
  /* ⚠️ flex-shrink:0 es crítico para el autoscroll (ver comentario arriba) */
  .tarjeta {
    flex-shrink:0;
    width:100%;
    max-width:65ch;
    margin:0 auto;
    padding:18vh 0; /* aire arriba/abajo; forma parte del viaje del scroll */
  }
  .titulo {
    font-size:1.05em;
    font-weight:600;
    margin-bottom:.35em;
  }
  .meta {
    font-size:.62em;
    color:var(--fg-muted);
    margin-bottom:1em;
  }
  .cuerpo {
    line-height:1.75;
    white-space:pre-wrap;
  }
  .placeholder {
    text-align:center;
    color:var(--fg-muted);
  }
</style>
</head>
<body>
<div id="textos"></div>
<script>
var TEXTOS = [{"media_id": 1341, "titulo": "Saliendo de Rojas hacia Melincué", "texto": "Permanecimos en Rojas hasta el 7 de abril (...) y por la tarde del 8 de abril llegamos al fortín Mercedes, a doce leguas de Rojas, donde había montados dos cañones de hierro y era notable solamente por un mirador, de unos cincuenta pies de alto, de donde los ojos podían llegar al máximo sin ver otra señal que de pasto o yuyos. Era para guardar de los ataques súbitos de los indios, y un cabo con cuatro hombres eran sus únicos defensores. Marchando hasta medianoche desuncimos en un ancho matorral, después de haber pasado una gran laguna y corrido hasta cansarlos a varias gamas y armadillos durante el día. En esta estación los fuegos distantes de los indios producían un efecto sorprendente, pues eran interminables a la vista debido a la sequedad del pasto.  Salimos el 9 temprano y al ponerse el sol descansábamos a una legua del fortín Melincué, que alcanzamos la mañana siguiente. \nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 60.0, "municipio": "Wheelwright"}, {"media_id": 1345, "titulo": "Saliendo de Oncativo", "texto": "(Llegamos a) Oncativo, la estación terminal, y desde ese punto nos trasladamos en mensajería a la docta ciudad de Córdoba (...) Viajar en mensajería era para mí una locomoción tan novedosa como divertida y llena de emociones. En un mail-coach o galera del tiempo colonial, de altas ruedas y un ancho adaptado a la huella, a lo que se reducían en esa época los caminos que cruzaban las vastas llanuras, se sentaban de seis a ocho pasajeros que, oprimidos, seguían el vaivén del pesado vehículo, siempre expuestos a chocar unos con otros. El conductor, con la corneta en la mano, ocupaba el pescante con algún pasajero que prefería respirar el aire libre al comprimido y a veces sofocante del interior de la galera. Tiraba el coche dos caballos de tronco, cada uno con su jinete o postillón, de cuya destreza dependía con frecuencia la vida de los pasajeros (...) Procedían dos o tres yuntas de cuarteadores tirando de un grueso torzal atado al eje y montados por otros tantos postillones que, cuando el camino y los caballos o las mulas, a veces chúcaras, lo permitían, imprimían al coche una velocidad capaz de asustar al más sereno, por los barquinazos continuos a que estaban expuestos los pasajeros enjaulados. Esto, sin embargo, no era lo peor de la jornada, que con frecuencia terminaba en una mísera posta donde los pasajeros tenían que reñir con las vinchucas y a veces, por toda cena, conformarse con las provisiones que una esposa previsora pusiera en el coche al partir.\nCarlos Christiernsson, Recuerdos de 42 años en la República Argentina (El libro fue publicado en 1910, el fragmento refiere a un viaje de Buenos Aires a Tucumán que Christiernsson, ingeniero sueco de Ferrocarriles, realizó entre 1868 y 1870)", "hora": 12.0, "keypoint": 60.0, "municipio": "Oncativo"}, {"media_id": 1346, "titulo": "Toledo (unos kilómetros antes de entrar a la ciudad de Córdoba)", "texto": "Tres leguas antes de entrar a Córdoba da principio el espeso monte hasta concluir su jurisdicción. De sus cercanías se provee la ciudad de leña seca en carretillas, que vale cada una cuatro reales, que es suficiente para el gasto de un mes en una casa de regular economía. También se sacan del interior del monte palos para techar las casas y fábrica de varios muebles.\nConcolorcorvo, El lazarillo de ciegos caminantes (1771)", "hora": 12.0, "keypoint": 60.0, "municipio": "Toledo"}, {"media_id": 1350, "titulo": "Saliendo de la ciudad de Córdoba I", "texto": "En la ancha faja de más de cien kilómetros de travesía que existe entre Córdoba y Santiago del Estero no hay agua potable, y en consecuencia hubo que traerse agua para la expedición, en barriles, a lomo de mula... El que cruza las salinas y la travesía a razón de veinte kilómetros por hora no puede formarse una idea de lo que cuesta atravesar esa zona desheredada de la naturaleza, a pie, con algunos centímetros de barro bajo la capa blanca de salitre que le imprime el aspecto de un gran lago de invierno en el norte de Europa con su capa de nieve. \nCarlos Christiernsson, Recuerdos de 42 años en la República Argentina (El libro fue publicado en 1910, el fragmento refiere a un viaje de Buenos Aires a Tucumán que Christiernsson, ingeniero sueco de Ferrocarriles, realizó entre 1868 y 1870)", "hora": 12.0, "keypoint": 60.0, "municipio": "Estación Juárez Celman"}];
(function(){
  var cont = document.getElementById('textos');
  var actual = -1;
  var animId = null;
  var ROTACION_SEG = 30; /* duración de CADA texto en pantalla, en ambos modos */

  /* ── Escaping HTML ────────────────────────────────────────── */
  /* AMP se construye por código para que la plantilla sobreviva cualquier
     procesamiento de entidades: los reemplazos son '&amp;', '&lt;', '&gt;'. */
  var AMP = String.fromCharCode(38);
  function escHtml(s){
    return s.replace(/&/g, AMP+'amp;').replace(/</g, AMP+'lt;').replace(/>/g, AMP+'gt;');
  }

  /* ── Construir tarjeta ────────────────────────────────────── */
  function construirCard(tx){
    var h = '';
    if (tx.titulo){
      h += '<div class="titulo">' + escHtml(tx.titulo) + '</div>';
    }
    if (tx.municipio){
      h += '<div class="meta">' + escHtml(tx.municipio) + '</div>';
    }
    h += '<div class="cuerpo">' + escHtml(tx.texto || '') + '</div>';
    return '<div class="tarjeta">' + h + '</div>';
  }

  /* ── Auto-scroll: UN solo descenso por slot (texto se lee una vez) ──────── */
  var PAUSA_INICIAL_MS = 5000;   /* quieto arriba: se ve el comienzo del texto */
  var FASE_SCROLL_MS   = 23000;  /* descenso continuo hasta el final */
  var PAUSA_FINAL_MS   = 2000;   /* quieto al final: se termina de leer */
  var SLOT_MS          = PAUSA_INICIAL_MS + FASE_SCROLL_MS + PAUSA_FINAL_MS;

  function cancelarAnim(){
    if (animId){ cancelAnimationFrame(animId); animId = null; }
  }

  /* Reloj base del slot: alineado al reloj de la rotación (mismo que
     indiceActual) para que el descenso ocupe exactamente el slot del texto.
     Con ?t0 es t0 + idx*ROTACION_SEG; en preview, la carga de la página. */
  var relojSlot = null;

  function iniciarScroll(tarjeta, idx){
    cancelarAnim();
    cont.style.justifyContent = 'center';
    tarjeta.style.transform = '';

    /* Medir: tarjeta (incluye el aire de su padding vertical) vs contenedor */
    var altT = tarjeta.offsetHeight;
    var altC = cont.clientHeight;
    if (altT <= altC) return; /* cabe: centrado, sin scroll */

    /* El texto se lee UNA sola vez en su slot: pausa arriba (5 s), descenso
       continuo (23 s) hasta el final, pausa al final (2 s). El aire del
       padding forma parte del recorrido: al inicio se ve el aire superior, al
       final el inferior. No hay vuelta al comienzo: al terminar el slot la
       rotación reemplaza el texto. */
    var recorrido = altT - altC;

    if (relojSlot === null){
      /* Base del reloj: t0 si viene en la URL (rotación fija), o la carga. */
      relojSlot = conReloj ? t0 : Date.now();
    }
    var inicioMs = relojSlot + idx * ROTACION_SEG * 1000;

    cont.style.justifyContent = 'flex-start';
    tarjeta.style.transition = 'none';

    function suave(p){ /* easeInOutSine: arranca y frena suave */
      return (1 - Math.cos(Math.PI * p)) / 2;
    }
    function tick(){
      var t = Date.now() - inicioMs;
      var y;
      if (t < PAUSA_INICIAL_MS){
        y = 0;                                          /* aire arriba visible */
      } else if (t < PAUSA_INICIAL_MS + FASE_SCROLL_MS){
        y = -recorrido * suave((t - PAUSA_INICIAL_MS) / FASE_SCROLL_MS);
      } else {
        y = -recorrido;                                 /* aire abajo visible */
        cancelarAnim();                                 /* slot completo: fin */
        return;
      }
      tarjeta.style.transform = 'translateY(' + y + 'px)';
      animId = requestAnimationFrame(tick);
    }
    animId = requestAnimationFrame(tick);
  }

  /* ── Rotación ─────────────────────────────────────────────── */
  var params  = new URLSearchParams(location.search);
  var t0      = parseFloat(params.get('t0'));
  var loopSecs = parseFloat(params.get('loop_secs'));
  var conReloj = isFinite(t0) && isFinite(loopSecs) && loopSecs > 0;

  function indiceActual(){
    if (TEXTOS.length === 0) return -1;
    if (conReloj){
      /* Rotación fija: cada texto dura ROTACION_SEG segundos, arrancando
         alineado al inicio del loop (t0) e independiente de loop_secs. */
      var t = Math.max(0, (Date.now() - t0) / 1000);
      return Math.floor(t / ROTACION_SEG) % TEXTOS.length;
    }
    /* Preview (sin ?t0): mismo paso de 30 s, anclado a la carga de página */
    return Math.floor(Date.now() / 1000 / ROTACION_SEG) % TEXTOS.length;
  }

  function pintar(){
    var idx = indiceActual();
    if (idx === actual) return;
    actual = idx;
    cancelarAnim();
    if (idx < 0 || TEXTOS.length === 0){
      cont.innerHTML = '<div class="placeholder">\u2014</div>';
      return;
    }
    cont.innerHTML = construirCard(TEXTOS[idx]);
    var tarjeta = cont.querySelector('.tarjeta');
    if (!tarjeta) return;
    requestAnimationFrame(function(){ iniciarScroll(tarjeta, idx); });
  }

  setInterval(pintar, 250);
  pintar();

  /* Re-medir en resize */
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ actual = -1; pintar(); }, 200);
  });
})();
</script>
</body>
</html>
