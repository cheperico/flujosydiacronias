<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujos · Textos (TD)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --escala: clamp(21px, calc(min(100vw, 100vh) * 0.042), 69px);
    --bg:#000; --fg:#fff; --fg-muted:#aaa;
  }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: var(--bg);
  }
  body {
    font-size: var(--escala);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--fg);
    line-height: 1.7;
  }
  #textos {
    display:flex; flex-direction:column;
    justify-content:center;
    width:100%; height:100%;
    overflow:hidden;
    padding: 0 2em;
  }
  /* ⚠️ flex-shrink:0 es crítico para el autoscroll (ver comentario arriba) */
  .tarjeta {
    flex-shrink:0;
    width:100%;
    max-width:65ch;
    margin:0 auto;
    padding:18vh 0; /* aire arriba/abajo; forma parte del viaje del scroll */
  }
  .titulo {
    font-size:1.05em;
    font-weight:600;
    margin-bottom:.35em;
  }
  .meta {
    font-size:.62em;
    color:var(--fg-muted);
    margin-bottom:1em;
  }
  .cuerpo {
    line-height:1.75;
    white-space:pre-wrap;
  }
  .placeholder {
    text-align:center;
    color:var(--fg-muted);
  }
</style>
</head>
<body>
<div id="textos"></div>
<script>
var TEXTOS = [{"media_id": 1336, "titulo": "Llegando a Luján", "texto": "El general Beresford y los oficiales, que iban bien montados, llegaron a Luján a las 4 pm, otros a las 7, con el aspecto más lamentable a causa del polvo y la fatiga, y en lo tocante a mi fueron las 11 de la noche antes de que llegase, aunque la torre de la villa se veía y parecía cercana cinco horas antes. Todos teníamos alojamiento con los habitantes y fuimos bien tratados por todas las criaturas del pueblo exceptuando las pulgas, que demostraron gran parcialidad por la sangre inglesa y total falta de sentimiento por nuestros cuerpos cansados. La mañana siguiente examinamos este lugar que contiene más de doscientas casas, de las que no más de tres son de altos, y las calles, si merecen ese nombre, corren en ángulos rectos y son muy angostas. Las construcciones son de barro, pero la iglesia es hermosa, con una especia de cúpula y por fuera semejante a las capillas de nuestro país (...). Hay, además, un Cabildo que se convirtió en alojamiento del general Beresford y los oficiales que permanecieron con él.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 64.28571428571428, "municipio": "Luján"}, {"media_id": 1337, "titulo": "Luján", "texto": "La primera peregrinación masiva a Luján tuvo lugar el 3 de diciembre de 1871. Fue convocada como desagravio por la injusta cautividad que el Papa Pío IX sufría en Roma y como agradecimiento por el cese del flagelo de la fiebre amarilla en Buenos Aires. Uno de los entusiastas peregrinos fue el joven padre Salvaire, quien apenas un par de meses antes había llegado a Argentina desde su Francia natal. En su libro Historia de Nuestra Señora de Luján nos cuenta la honda emoción que le provocó ver la cantidad de exvotos que había en el camarín y cómo supo leer en esas ofrendas la historia de amor entre la Virgen de Luján y el pueblo al que le dedicaría su vida. También nos transcribe una detallada crónica de ese día escrita por un “testigo ocular” (probablemente él mismo). Leamos unos breves fragmentos para hacernos una idea de lo que fueron esas primeras peregrinaciones: “Por la mañana de ese día memorable, un sol resplandeciente y un ambiente templado nos auguraron un día hermoso (...) El Directorio del ferrocarril del Oeste, con un tino y una discreción superior a todo encomio, había tenido a bien poner a disposición de los peregrinos de la Capital, un tren especial”.\nEnrique Ciro Bianchi, Las peregrinaciones a Luján en la historia (2022)", "hora": 12.0, "keypoint": 64.28571428571428, "municipio": "Luján"}, {"media_id": 1338, "titulo": "Cruzando el río Luján", "texto": "(EN LA BASÍLICA DE LUJÁN) se guarda la venerada imagen, sobre la que se cuenta la siguiente tradición: llevaban de Buenos Aires a Chile, por el camino a través del país, dos imágenes en talla de la Virgen cuando, de pronto, el carro donde viajaba una de ellas empezó a encontrar obstáculos en el camino y al fin se rompió en las proximidades del río Luján. Este accidente fue considerado milagroso, creyéndose que la Virgen se rehusaba a cruzar la corriente. Entonces resolvieron erigir una iglesia en los márgenes del arroyo.  \nWilliam Mac Cann, Viaje a caballo por las provincias argentinas (1853)", "hora": 12.0, "keypoint": 64.28571428571428, "municipio": "Luján"}, {"media_id": 1339, "titulo": "Salto", "texto": "En lados opuestos (...) se hallan la iglesia y el fuerte; la primera sencilla y el último (...) con dos de sus frentes levantados con tierra endurecida sacada del lecho del río y los otros protegidos por un foso y palizadas. Once cañones de hierro y pedreros estaban emplazados en estado ruinoso y había cuarteles anexos en condición análoga. La fuerza militar destinada a su defensa, si efectiva, consistía en un capitán primero y otro segundo, con cincuenta hombres que siempre eran criollos. Pero este puesto de frontera no hubiera resistido a cincuenta hombres decididos ni veinte minutos, mucho menos a esas incursiones repentinas de huestes indianas, contra que era barrera (...). Los objetos principales de esas guardias eran traficar y contrabandear donde podían, sea con sus paisanos errantes o con los indios vecinos, que tres veces entraron en el pueblito de Salto mientras estábamos allí para trocar sus mercaderías.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 64.28571428571428, "municipio": "Salto"}, {"media_id": 1340, "titulo": "Saliendo de Salto y llegando a Rojas", "texto": "Temprano estaban listas las carretas en el llano abajo del pueblo, pero no nos movimos hasta después del mediodía y no habíamos marchado más de cinco millas cuando hicimos alto para pasar la noche en la orilla de un río. Sesenta oficiales con sus asistentes, además de los prisioneros mercantiles que recientemente se nos habían unido, formaban en total un cuerpo de más de doscientos que, con una escolta de cien soldados y cuarenta y nueve carretas, alargaba nuestra línea de marcha más de dos millas y retardaba nuestro avance por aquellas barrancas que con tanta frecuencia cortan el campo (...). Al aclarar el 31 de marzo (DE 1807) cruzamos el río y llegamos a dos leguas del pueblo de Rojas, que está a once de Salto, a las siete de la tarde, llegando al primero al mediodía del 1° de abril. En esos días el campo se hizo más desigual y el pasto, de naturaleza más juncosa (...). El pueblo de Salto es más chico que el de Salto, pero las casas están en mejor condición y más lindas huertas las rodean. Ladrillos de barro endurecidos al sol componen sus habitaciones y su manera de techarlas con paja era al mismo tiempo sencilla e ingeniosa (...). El pueblo está sobre un río que es la frontera estipulada entre españoles e indios, cuya letra estricta hubiera autorizado actos hostiles contra cualquiera que intentase cruzarlo, pero los primeros no se refrenaban de tal transgresión. El pueblo está en el camino que lleva a Córdoba por el país de las Pampas, y aunque tan inmediatamente expuesto a invasiones el fuerte estaba en el mismo estado ruinoso que el de Salto. \nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 64.28571428571428, "municipio": "Salto"}, {"media_id": 1346, "titulo": "Toledo (unos kilómetros antes de entrar a la ciudad de Córdoba)", "texto": "Tres leguas antes de entrar a Córdoba da principio el espeso monte hasta concluir su jurisdicción. De sus cercanías se provee la ciudad de leña seca en carretillas, que vale cada una cuatro reales, que es suficiente para el gasto de un mes en una casa de regular economía. También se sacan del interior del monte palos para techar las casas y fábrica de varios muebles.\nConcolorcorvo, El lazarillo de ciegos caminantes (1771)", "hora": 12.0, "keypoint": 64.28571428571428, "municipio": "Toledo"}];
(function(){
  var cont = document.getElementById('textos');
  var actual = -1;
  var animId = null;
  var ROTACION_SEG = 30; /* duración de CADA texto en pantalla, en ambos modos */

  /* ── Escaping HTML ────────────────────────────────────────── */
  /* AMP se construye por código para que la plantilla sobreviva cualquier
     procesamiento de entidades: los reemplazos son '&amp;', '&lt;', '&gt;'. */
  var AMP = String.fromCharCode(38);
  function escHtml(s){
    return s.replace(/&/g, AMP+'amp;').replace(/</g, AMP+'lt;').replace(/>/g, AMP+'gt;');
  }

  /* ── Construir tarjeta ────────────────────────────────────── */
  function construirCard(tx){
    var h = '';
    if (tx.titulo){
      h += '<div class="titulo">' + escHtml(tx.titulo) + '</div>';
    }
    if (tx.municipio){
      h += '<div class="meta">' + escHtml(tx.municipio) + '</div>';
    }
    h += '<div class="cuerpo">' + escHtml(tx.texto || '') + '</div>';
    return '<div class="tarjeta">' + h + '</div>';
  }

  /* ── Auto-scroll: UN solo descenso por slot (texto se lee una vez) ──────── */
  var PAUSA_INICIAL_MS = 5000;   /* quieto arriba: se ve el comienzo del texto */
  var FASE_SCROLL_MS   = 23000;  /* descenso continuo hasta el final */
  var PAUSA_FINAL_MS   = 2000;   /* quieto al final: se termina de leer */
  var SLOT_MS          = PAUSA_INICIAL_MS + FASE_SCROLL_MS + PAUSA_FINAL_MS;

  function cancelarAnim(){
    if (animId){ cancelAnimationFrame(animId); animId = null; }
  }

  /* Reloj base del slot (definido tras conReloj, abajo). El descenso se ancla
     al OFFSET dentro del slot actual ((Date.now()-relojSlot) % SLOT_MS), el
     mismo reloj que usa indiceActual para elegir el texto: así ocupa
     exactamente el slot y ocurre una sola vez. relojSlot = t0 si ?t0, o la
     carga de la página en preview. */
  var relojSlot = null;

  function iniciarScroll(tarjeta){
    cancelarAnim();
    cont.style.justifyContent = 'center';
    tarjeta.style.transform = '';

    /* Medir: tarjeta (incluye el aire de su padding vertical) vs contenedor */
    var altT = tarjeta.offsetHeight;
    var altC = cont.clientHeight;
    if (altT <= altC) return; /* cabe: centrado, sin scroll */

    /* El texto se lee UNA sola vez en su slot: pausa arriba (5 s), descenso
       continuo (23 s) hasta el final, pausa al final (2 s). El aire del
       padding forma parte del recorrido: al inicio se ve el aire superior, al
       final el inferior. No hay vuelta al comienzo: al terminar el slot la
       rotación reemplaza el texto. */
    var recorrido = altT - altC;

    cont.style.justifyContent = 'flex-start';
    tarjeta.style.transition = 'none';

    function suave(p){ /* easeInOutSine: arranca y frena suave */
      return (1 - Math.cos(Math.PI * p)) / 2;
    }
    function tick(){
      var t = ((Date.now() - relojSlot) % SLOT_MS + SLOT_MS) % SLOT_MS;
      var y;
      if (t < PAUSA_INICIAL_MS){
        y = 0;                                          /* aire arriba visible */
      } else if (t < PAUSA_INICIAL_MS + FASE_SCROLL_MS){
        y = -recorrido * suave((t - PAUSA_INICIAL_MS) / FASE_SCROLL_MS);
      } else {
        y = -recorrido;                                 /* aire abajo visible */
        cancelarAnim();                                 /* slot completo: fin */
        return;
      }
      tarjeta.style.transform = 'translateY(' + y + 'px)';
      animId = requestAnimationFrame(tick);
    }
    animId = requestAnimationFrame(tick);
  }

  /* ── Rotación ─────────────────────────────────────────────── */
  var params  = new URLSearchParams(location.search);
  var t0      = parseFloat(params.get('t0'));
  var loopSecs = parseFloat(params.get('loop_secs'));
  var conReloj = isFinite(t0) && isFinite(loopSecs) && loopSecs > 0;
  relojSlot = conReloj ? t0 : Date.now();

  function indiceActual(){
    if (TEXTOS.length === 0) return -1;
    if (conReloj){
      /* Rotación fija: cada texto dura ROTACION_SEG segundos, arrancando
         alineado al inicio del loop (t0) e independiente de loop_secs. */
      var t = Math.max(0, (Date.now() - t0) / 1000);
      return Math.floor(t / ROTACION_SEG) % TEXTOS.length;
    }
    /* Preview (sin ?t0): mismo paso de 30 s, anclado a la carga de página */
    return Math.floor(Date.now() / 1000 / ROTACION_SEG) % TEXTOS.length;
  }

  function pintar(){
    var idx = indiceActual();
    if (idx === actual) return;
    actual = idx;
    cancelarAnim();
    if (idx < 0 || TEXTOS.length === 0){
      cont.innerHTML = '<div class="placeholder">\u2014</div>';
      return;
    }
    cont.innerHTML = construirCard(TEXTOS[idx]);
    var tarjeta = cont.querySelector('.tarjeta');
    if (!tarjeta) return;
    requestAnimationFrame(function(){ iniciarScroll(tarjeta); });
  }

  setInterval(pintar, 250);
  pintar();

  /* Re-medir en resize */
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ actual = -1; pintar(); }, 200);
  });
})();
</script>
</body>
</html>
