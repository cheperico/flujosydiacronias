<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujos · Textos (TD)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --escala: clamp(21px, calc(min(100vw, 100vh) * 0.042), 69px);
    --bg:#000; --fg:#fff; --fg-muted:#aaa;
  }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: var(--bg);
  }
  body {
    font-size: var(--escala);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--fg);
    line-height: 1.7;
  }
  #textos {
    display:flex; flex-direction:column;
    justify-content:center;
    width:100%; height:100%;
    overflow:hidden;
    padding: 0 2em;
  }
  /* ⚠️ flex-shrink:0 es crítico para el autoscroll (ver comentario arriba) */
  .tarjeta {
    flex-shrink:0;
    width:100%;
    max-width:65ch;
    margin:0 auto;
    padding:18vh 0; /* aire arriba/abajo; forma parte del viaje del scroll */
  }
  .titulo {
    font-size:1.05em;
    font-weight:600;
    margin-bottom:.35em;
  }
  .meta {
    font-size:.62em;
    color:var(--fg-muted);
    margin-bottom:1em;
  }
  .cuerpo {
    line-height:1.75;
    white-space:pre-wrap;
  }
  .placeholder {
    text-align:center;
    color:var(--fg-muted);
  }
</style>
</head>
<body>
<div id="textos"></div>
<script>
var TEXTOS = [{"media_id": 816, "titulo": "Ruta 7 a la altura de Morón", "texto": "Como no había puestos de ayuda en la ruta cada uno echaba mano de lo que tenía para ayudar. En mi caso era una tía que vivía en Morón, “la tía ñata”, Amelia de los Ángeles Lebozo de Corradi. Parábamos en su casa, muy grande, con un gran parque, en la calle república oriental del Uruguay y Ntra. Sra. Del Buen Viaje; ¡parecía un centro de refugiados! Por lo menos la invadíamos cerca de 70 jóvenes. Como ella era muy proactiva en la parroquia de la catedral de Morón, se puso en contacto con varias comunidades parroquiales y conocidos a lo largo de la ruta 7, y éstas, a su vez, con los vecinos frentista de la ruta o cercanos a ella. Estos samaritanos dejaban pasar a las mujeres al baño y otras necesidades que iban surgiendo; hasta hubo un pastor de una iglesia Cristina Evangélica que en Merlo nos prestó sus instalaciones, dado que estaba cerca de la ruta. Hoy, que vivimos en una sociedad individualista, estas actitudes serían extrañas y yo diría casi impensables.\nDi Fazio, “La historia de la peregrinación a Luján: las anécdotas de los primeros años y cómo empezaron a marchar los jóvenes” (2024)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "Moreno"}, {"media_id": 818, "titulo": "Llegando a Luján", "texto": "El general Beresford y los oficiales, que iban bien montados, llegaron a Luján a las 4 pm, otros a las 7, con el aspecto más lamentable a causa del polvo y la fatiga, y en lo tocante a mi fueron las 11 de la noche antes de que llegase, aunque la torre de la villa se veía y parecía cercana cinco horas antes. Todos teníamos alojamiento con los habitantes y fuimos bien tratados por todas las criaturas del pueblo exceptuando las pulgas, que demostraron gran parcialidad por la sangre inglesa y total falta de sentimiento por nuestros cuerpos cansados. La mañana siguiente examinamos este lugar que contiene más de doscientas casas, de las que no más de tres son de altos, y las calles, si merecen ese nombre, corren en ángulos rectos y son muy angostas. Las construcciones son de barro, pero la iglesia es hermosa, con una especia de cúpula y por fuera semejante a las capillas de nuestro país (...). Hay, además, un Cabildo que se convirtió en alojamiento del general Beresford y los oficiales que permanecieron con él.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "Luján"}, {"media_id": 819, "titulo": "Luján", "texto": "La primera peregrinación masiva a Luján tuvo lugar el 3 de diciembre de 1871. Fue convocada como desagravio por la injusta cautividad que el Papa Pío IX sufría en Roma y como agradecimiento por el cese del flagelo de la fiebre amarilla en Buenos Aires. Uno de los entusiastas peregrinos fue el joven padre Salvaire, quien apenas un par de meses antes había llegado a Argentina desde su Francia natal. En su libro Historia de Nuestra Señora de Luján nos cuenta la honda emoción que le provocó ver la cantidad de exvotos que había en el camarín y cómo supo leer en esas ofrendas la historia de amor entre la Virgen de Luján y el pueblo al que le dedicaría su vida. También nos transcribe una detallada crónica de ese día escrita por un “testigo ocular” (probablemente él mismo). Leamos unos breves fragmentos para hacernos una idea de lo que fueron esas primeras peregrinaciones: “Por la mañana de ese día memorable, un sol resplandeciente y un ambiente templado nos auguraron un día hermoso (...) El Directorio del ferrocarril del Oeste, con un tino y una discreción superior a todo encomio, había tenido a bien poner a disposición de los peregrinos de la Capital, un tren especial”.\nEnrique Ciro Bianchi, Las peregrinaciones a Luján en la historia (2022)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "Luján"}, {"media_id": 820, "titulo": "Cruzando el río Luján", "texto": "(EN LA BASÍLICA DE LUJÁN) se guarda la venerada imagen, sobre la que se cuenta la siguiente tradición: llevaban de Buenos Aires a Chile, por el camino a través del país, dos imágenes en talla de la Virgen cuando, de pronto, el carro donde viajaba una de ellas empezó a encontrar obstáculos en el camino y al fin se rompió en las proximidades del río Luján. Este accidente fue considerado milagroso, creyéndose que la Virgen se rehusaba a cruzar la corriente. Entonces resolvieron erigir una iglesia en los márgenes del arroyo.  \nWilliam Mac Cann, Viaje a caballo por las provincias argentinas (1853)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "Luján"}, {"media_id": 826, "titulo": "De Saladillo hacia Córdoba", "texto": "Cuando llegamos al primer río, llamado Saladillo, noté la acción del fuego sobre sus orillas en época remota. La sólida marga del cauce está mezclada con conchas calcinadas. Pasando Barrancas el viajero, seis leguas más adelante, llega a Fraile Muerto (BELL VILLE), donde comienza la subida. Las postas son regulares y la mirada se alivia de la penosa y negra uniformidad de las pampas. El follaje del monte alegra los ojos. La naturaleza aumenta en belleza a medida que continúa la ascención y se presenta un variado y rico espectáculo. Pronto cambia esta variada perspectiva en denso matorral que se mantiene casi todo el camino hasta Córdoba, salvo en la vecindad del río Tercero y de otros arroyos que lo interceptan. En el paso de Ferreira, cuando bajamos la cuesta, se nos previno de alguna dificultad y peligro con un grito en no ordinario tono de voz. Los muchachos gauchos sujetaron el momento y cuando bajamos la ventanilla para inquirir de dónde procedía el grito se introdujo en el carruaje la cabeza de un negro de dimensiones gigantescas y repugnante fealdad (...) El africano montaba una mula, completamente desnudo (...) Al principio fue difícil comprender lo que quería, tan furioso y ensordecedor era ruido que hacía, pero por fin comprendimos que, como el río que teníamos por delante era correntoso y estaba crecido, había venido a ofrecernos su ayuda para vadearlo. No obstante esto, sus gestos y vociferaciones parecían de maniático, y cuando arrimó el hombro a las ruedas su simple esfuerzo parecía más eficaz para hacerlas mover que el rebenque y el espolear de todos nuestros peones (...) Su fuerza y fama pueden juzgarse por su fama en la plaza de toros de Córdoba donde, según oímos después, frecuentemente cansaba a los toros más bravos saltándoles al lomo y quedando tan firmemente sentado que, siendo en vano todos los esfuerzos del animal furiosos para deshacerse de la carga, por in se desplomaba cansado debajo del hercúleo jinete.\nJoseph Andrews, Viaje de Buenos Aires a Potosí y Arica (1825)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "Bell Ville"}, {"media_id": 834, "titulo": "Saliendo de Córdoba hacia Jesús María", "texto": "Las carretas, regularmente, cuando salen de esta ciudad siguiendo el viaje que llevo, no pasan de la otra banda del río, adonde harán prevención de agua los señores caminantes para dos días, no haciendo mucha confianza de la botija que va en cada carreta, porque en el camino sólo se encuentra un pozo, en tiempo de avenidas, que enturbia mucho el ganado y no se halla agua en trece leguas de monte muy espeso y ardiente, hasta que se encuentra la estancia llamada Caroya (COLONIA CAROYA), perteneciente al colegio de Monserrat de Córdoba, y entre ésta y Sinsacate está la Hacienda del Rey, nombrada Jesús María, que administra don Juan Jacinto de Figueroa.\nConcolorcorvo, El lazarillo de ciegos caminantes (1771)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "Colonia Caroya"}, {"media_id": 849, "titulo": "Llegando a San Miguel de Tucumán", "texto": "A las nueve de la mañana del día siguiente continué rumbo a Tucumán adonde llegué bien entrada la noche (...) En un lugar del camino me sucedió una cosa curiosa: mientras paraba a inflar una goma, a unos mil metros de un pueblo, apareció un linyera debajo de una alcantarilla cercana y naturalmente iniciamos una conversación. Este hombre venía de la cosecha de algodón en el Chaco y pensaba, luego de vagar un poco dirigirse a San Juan, a la vendimia. Enterado de mi plan de recorrer unas cuantas provincias y luego de saber que mi hazaña era puramente deportiva, se agarró la cabeza con aire desesperado: ‘Mama mía ¿toda esa fuerza se gasta inútilmente usted?’.\nErnesto \"Che\" Guevara, Diario de un viaje en bicimoto por las provincias argentinas (el texto, escrito en 1950, fue publicado por Ernesto Guevara Lynch en el libro Mi hijo El Che)", "hora": 12.0, "keypoint": 81.81818181818181, "municipio": "San Andrés"}];
(function(){
  var cont = document.getElementById('textos');
  var actual = -1;
  var animId = null;
  var ROTACION_SEG = 30; /* duración de CADA texto en pantalla, en ambos modos */

  /* ── Escaping HTML ────────────────────────────────────────── */
  /* AMP se construye por código para que la plantilla sobreviva cualquier
     procesamiento de entidades: los reemplazos son '&amp;', '&lt;', '&gt;'. */
  var AMP = String.fromCharCode(38);
  function escHtml(s){
    return s.replace(/&/g, AMP+'amp;').replace(/</g, AMP+'lt;').replace(/>/g, AMP+'gt;');
  }

  /* ── Construir tarjeta ────────────────────────────────────── */
  function construirCard(tx){
    var h = '';
    if (tx.titulo){
      h += '<div class="titulo">' + escHtml(tx.titulo) + '</div>';
    }
    if (tx.municipio){
      h += '<div class="meta">' + escHtml(tx.municipio) + '</div>';
    }
    h += '<div class="cuerpo">' + escHtml(tx.texto || '') + '</div>';
    return '<div class="tarjeta">' + h + '</div>';
  }

  /* ── Auto-scroll: UN solo descenso por slot (texto se lee una vez) ──────── */
  var PAUSA_INICIAL_MS = 5000;   /* quieto arriba: se ve el comienzo del texto */
  var FASE_SCROLL_MS   = 23000;  /* descenso continuo hasta el final */
  var PAUSA_FINAL_MS   = 2000;   /* quieto al final: se termina de leer */
  var SLOT_MS          = PAUSA_INICIAL_MS + FASE_SCROLL_MS + PAUSA_FINAL_MS;

  function cancelarAnim(){
    if (animId){ cancelAnimationFrame(animId); animId = null; }
  }

  /* Reloj base del slot (definido tras conReloj, abajo). El descenso se ancla
     al OFFSET dentro del slot actual ((Date.now()-relojSlot) % SLOT_MS), el
     mismo reloj que usa indiceActual para elegir el texto: así ocupa
     exactamente el slot y ocurre una sola vez. relojSlot = t0 si ?t0, o la
     carga de la página en preview. */
  var relojSlot = null;

  function iniciarScroll(tarjeta){
    cancelarAnim();
    cont.style.justifyContent = 'center';
    tarjeta.style.transform = '';

    /* Medir: tarjeta (incluye el aire de su padding vertical) vs contenedor */
    var altT = tarjeta.offsetHeight;
    var altC = cont.clientHeight;
    if (altT <= altC) return; /* cabe: centrado, sin scroll */

    /* El texto se lee UNA sola vez en su slot: pausa arriba (5 s), descenso
       continuo (23 s) hasta el final, pausa al final (2 s). El aire del
       padding forma parte del recorrido: al inicio se ve el aire superior, al
       final el inferior. No hay vuelta al comienzo: al terminar el slot la
       rotación reemplaza el texto. */
    var recorrido = altT - altC;

    cont.style.justifyContent = 'flex-start';
    tarjeta.style.transition = 'none';

    function suave(p){ /* easeInOutSine: arranca y frena suave */
      return (1 - Math.cos(Math.PI * p)) / 2;
    }
    function tick(){
      var t = ((Date.now() - relojSlot) % SLOT_MS + SLOT_MS) % SLOT_MS;
      var y;
      if (t < PAUSA_INICIAL_MS){
        y = 0;                                          /* aire arriba visible */
      } else if (t < PAUSA_INICIAL_MS + FASE_SCROLL_MS){
        y = -recorrido * suave((t - PAUSA_INICIAL_MS) / FASE_SCROLL_MS);
      } else {
        y = -recorrido;                                 /* aire abajo visible */
        cancelarAnim();                                 /* slot completo: fin */
        return;
      }
      tarjeta.style.transform = 'translateY(' + y + 'px)';
      animId = requestAnimationFrame(tick);
    }
    animId = requestAnimationFrame(tick);
  }

  /* ── Rotación ─────────────────────────────────────────────── */
  var params  = new URLSearchParams(location.search);
  var t0      = parseFloat(params.get('t0'));
  var loopSecs = parseFloat(params.get('loop_secs'));
  var conReloj = isFinite(t0) && isFinite(loopSecs) && loopSecs > 0;
  relojSlot = conReloj ? t0 : Date.now();

  function indiceActual(){
    if (TEXTOS.length === 0) return -1;
    if (conReloj){
      /* Rotación fija: cada texto dura ROTACION_SEG segundos, arrancando
         alineado al inicio del loop (t0) e independiente de loop_secs. */
      var t = Math.max(0, (Date.now() - t0) / 1000);
      return Math.floor(t / ROTACION_SEG) % TEXTOS.length;
    }
    /* Preview (sin ?t0): mismo paso de 30 s, anclado a la carga de página */
    return Math.floor(Date.now() / 1000 / ROTACION_SEG) % TEXTOS.length;
  }

  function pintar(){
    var idx = indiceActual();
    if (idx === actual) return;
    actual = idx;
    cancelarAnim();
    if (idx < 0 || TEXTOS.length === 0){
      cont.innerHTML = '<div class="placeholder">\u2014</div>';
      return;
    }
    cont.innerHTML = construirCard(TEXTOS[idx]);
    var tarjeta = cont.querySelector('.tarjeta');
    if (!tarjeta) return;
    requestAnimationFrame(function(){ iniciarScroll(tarjeta); });
  }

  setInterval(pintar, 250);
  pintar();

  /* Re-medir en resize */
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ actual = -1; pintar(); }, 200);
  });
})();
</script>
</body>
</html>
