<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --escala: clamp(21px, calc(min(100vw, 100vh) * 0.042), 69px);
    --bg:#000; --fg:#fff; --fg-muted:#aaa;
  }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: var(--bg);
  }
  body {
    font-size: var(--escala);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--fg);
    line-height: 1.7;
  }
  #textos {
    display:flex; flex-direction:column;
    justify-content:center;
    width:100%; height:100%;
    overflow:hidden;
    padding: 0 2em;
  }
  /* ⚠️ flex-shrink:0 es crítico para el autoscroll (ver comentario arriba) */
  .tarjeta {
    flex-shrink:0;
    width:100%;
    max-width:65ch;
    margin:0 auto;
    padding:18vh 0; /* aire arriba/abajo; forma parte del viaje del scroll */
  }
  .titulo {
    font-size:1.05em;
    font-weight:600;
    margin-bottom:.35em;
  }
  .meta {
    font-size:.62em;
    color:var(--fg-muted);
    margin-bottom:1em;
  }
  .cuerpo {
    line-height:1.75;
    white-space:pre-wrap;
  }
  .placeholder {
    text-align:center;
    color:var(--fg-muted);
  }
</style>
</head>

<div id="textos"></div>
<script>
var TEXTOS = [{"media_id": 1, "titulo": "General Rodríguez", "texto": "Salimos temprano del borde oeste del Gran Buenos Aires. El asfalto todavía guardaba la frescura de la noche y los primeros kilómetros pasaron entre quintas, viveros y el rumor lejano de la Route 7.", "hora": 12.0, "keypoint": 10.0, "municipio": "General Rodríguez"}, {"media_id": 2, "titulo": "La travesía hacia Luján", "texto": "(Crónica del tercer día)\n\nAmanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Amanecimos con el rocío sobre las bicicletas y la ruta todavía dormida. El campo se abría entre alambrados y molinos, y cada tanto un perro nos ladraba desde algún patio sin urgencia. Al atardecer apareció la basílica a lo lejos, primero como una mancha clara sobre el cielo y después como una presencia que crecía a cada pedaleada. La ciudad nos recibió con peregrinos, banderines y el aire denso de las veladoras.", "hora": 12.0, "keypoint": 20.0, "municipio": "Luján"}, {"media_id": 3, "titulo": "", "texto": "Fragmento sin título encontrado entre las notas del cuaderno de ruta: listas de precios de un almacén de campaña, la dirección de un taller de bicicletas en Salto y un dibujo de la carpa armada bajo dos eucaliptus.", "hora": 12.0, "keypoint": 30.0, "municipio": ""}, {"media_id": 4, "titulo": "Noche en Venado Tuerto", "texto": "(22 de marzo) La ciudad nos sorprendió con una plaza iluminada y una cantina donde la dueña nos dejó cargar los teléfonos. Llovía fino cuando doblamos hacia el camping; el olor a tierra mojada acompañó toda la noche.", "hora": 12.0, "keypoint": 40.0, "municipio": "Venado Tuerto"}];
(function(){
  var cont = document.getElementById('textos');
  var actual = -1;
  var animId = null;
  var ROTACION_SEG = 30; /* duración de CADA texto en pantalla, en ambos modos */

  /* ── Escaping HTML ────────────────────────────────────────── */
  /* AMP se construye por código para que la plantilla sobreviva cualquier
     procesamiento de entidades: los reemplazos son '&amp;', '&lt;', '&gt;'. */
  var AMP = String.fromCharCode(38);
  function escHtml(s){
    return s.replace(/&/g, AMP+'amp;').replace(/</g, AMP+'lt;').replace(/>/g, AMP+'gt;');
  }

  /* ── Construir tarjeta ────────────────────────────────────── */
  function construirCard(tx){
    var h = '';
    if (tx.titulo){
      h += '<div class="titulo">' + escHtml(tx.titulo) + '</div>';
    }
    if (tx.municipio){
      h += '<div class="meta">' + escHtml(tx.municipio) + '</div>';
    }
    h += '<div class="cuerpo">' + escHtml(tx.texto || '') + '</div>';
    return '<div class="tarjeta">' + h + '</div>';
  }

  /* ── Auto-scroll lento (requestAnimationFrame) ────────────── */
  function cancelarAnim(){
    if (animId){ cancelAnimationFrame(animId); animId = null; }
  }

  function iniciarScroll(tarjeta){
    cancelarAnim();
    cont.style.justifyContent = 'center';
    tarjeta.style.transform = '';

    /* Medir: tarjeta (incluye el aire de su padding vertical) vs contenedor */
    var altT = tarjeta.offsetHeight;
    var altC = cont.clientHeight;
    if (altT <= altC) return; /* cabe: centrado, sin scroll */

    /* UN único ciclo baja-subir que ocupa TODO el slot del texto. El aire del
       padding forma parte del recorrido: al inicio se ve el aire superior, al
       final el inferior. La velocidad emerge de dividir recorrido / tiempo. */
    var recorrido  = altT - altC;
    var slotMs     = ROTACION_SEG * 1000;
    var pausaBorde = 2000;                          /* pausa arriba y abajo */
    var faseScroll = (slotMs - 2 * pausaBorde) / 2; /* duración de cada dirección */

    cont.style.justifyContent = 'flex-start';
    tarjeta.style.transition = 'none';

    var inicio = performance.now();
    function suave(p){ /* easeInOutSine: arranca y frena suave */
      return (1 - Math.cos(Math.PI * p)) / 2;
    }
    function tick(now){
      var t = ((now - inicio) % slotMs + slotMs) % slotMs;
      var y;
      if (t < pausaBorde){
        y = 0;                                          /* aire arriba visible */
      } else if (t < pausaBorde + faseScroll){
        y = -recorrido * suave((t - pausaBorde) / faseScroll);
      } else if (t < pausaBorde + faseScroll + pausaBorde){
        y = -recorrido;                                 /* aire abajo visible */
      } else {
        var p = (t - pausaBorde - faseScroll - pausaBorde) / faseScroll;
        y = -recorrido * (1 - suave(p));                /* vuelve arriba */
      }
      tarjeta.style.transform = 'translateY(' + y + 'px)';
      animId = requestAnimationFrame(tick);
    }
    animId = requestAnimationFrame(tick);
  }

  /* ── Rotación ─────────────────────────────────────────────── */
  var params  = new URLSearchParams(location.search);
  var t0      = parseFloat(params.get('t0'));
  var loopSecs = parseFloat(params.get('loop_secs'));
  var conReloj = isFinite(t0) && isFinite(loopSecs) && loopSecs > 0;

  function indiceActual(){
    if (TEXTOS.length === 0) return -1;
    if (conReloj){
      /* Rotación fija: cada texto dura ROTACION_SEG segundos, arrancando
         alineado al inicio del loop (t0) e independiente de loop_secs. */
      var t = Math.max(0, (Date.now() - t0) / 1000);
      return Math.floor(t / ROTACION_SEG) % TEXTOS.length;
    }
    /* Preview (sin ?t0): mismo paso de 30 s, anclado a la carga de página */
    return Math.floor(Date.now() / 1000 / ROTACION_SEG) % TEXTOS.length;
  }

  function pintar(){
    var idx = indiceActual();
    if (idx === actual) return;
    actual = idx;
    cancelarAnim();
    if (idx < 0 || TEXTOS.length === 0){
      cont.innerHTML = '<div class="placeholder">\u2014</div>';
      return;
    }
    cont.innerHTML = construirCard(TEXTOS[idx]);
    var tarjeta = cont.querySelector('.tarjeta');
    if (!tarjeta) return;
    requestAnimationFrame(function(){ iniciarScroll(tarjeta); });
  }

  setInterval(pintar, 250);
  pintar();

  /* Re-medir en resize */
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ actual = -1; pintar(); }, 200);
  });
})();
</script>
