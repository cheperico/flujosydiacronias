<script>
var TEXTOS = [{"media_id": 1329, "titulo": "Planificando el viaje", "texto": "Durante los preparativos, Tschiffely eligió una silla de gaucho tradicional, compuesta de una armadura liviana, de 60 centímetros de largo aproximadamente, cubierta de una piel. Además de resultar cómoda para el caballo, se puede utilizar a la noche, como almohada mientras que las pieles de oveja desmontables se transforman en confortable cama (...) El equipo para el gran viaje ha sido reducido a lo mínimo. Tschiffely se armó con una Smith and Wesson 45, una carabina a repetición calibre 12, un Winchester 44, se proveyó de mapas, de su pasaporte, tarjetas de crédito, brújula, barómetro, una manta de lana, un poncho liviano de caucho, anteojos y un gran mosquitero adaptable a su sombrero de bordes anchos.\n\nCuChullaine OReilly, “Tschiffely, Gato y Mancha, héroes de la pampa” (2002)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": ""}, {"media_id": 1330, "titulo": "Antes de partir", "texto": "Finalmente, sólo había que hacer una cosa: juntar todas las fuerzas, quemar todos los puentes detrás de mí y comenzar una nueva vida, poco importa a dónde podría llevarme. Convencido de que quien no ha vivido con audacia jamás ha probado la sal de la vida, un día decidí arrojarme al agua.\nAimé Tschiffely, Mancha y Gato cuentan sus aventuras (publicado en 1945 el libro narra el viaje de Tschiffely y los caballos Gato y Mancha, que salieron de Buenos Aires en 1925 y llegaron a Nueva York tres años después)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": ""}, {"media_id": 1331, "titulo": "Saliendo de la ciudad de Buenos Aires", "texto": "Nos reunimos como de costumbre en Los Tres Reyes y después (...) toda la cabalgata entró en la Plaza Mayor, la tarde del 11 (DE OCTUBRE DE 1806), donde un número inmenso de caballos del rey estaban ensillados y enfrenados y listos para el viaje. No obstante la super abundancia de alimento cerca de la mano aún estaban en mísero estado y mal calificados para un viaje largo. Se nos adjudicaron también carretas, una para cada dos oficiales, que servían de depósito para nuestras provisiones, los restos desdichados de nuestro bagaje y como refugio nocturno (...). El general Beresford, con su estado mayor, iba adelante en un coche a esa misma hora y habiendo salido las carretas por la mañana temprano, habían ido más allá del lugar de descanso que se nos había señalado hasta el día siguiente. Este era un viejo colegio antes perteneciente a los jesuitas (...) como a dos leguas de Buenos Aires, donde llegamos a las seis (...). El corto espacio que habíamos andado era adornado un gran trecho por huertos cercados con matorral de membrilleros y pencas y nuestro rumbo noroeste en el camino a Luján. Al alba volvimos a montar el 12 de octubre los mismos caballos que había sido llevados a pastar durante la noche con dos personas para cuidarlos. Las molestias de ese día fueron muchas y penosas, que la vista perpetua de una llanura nivelada y lozana cubierta de ganado y el herbaje con maizales y trigales no podían desviar o suavizar. Llegamos a una posta a las diez, a cuatro leguas de Buenos Aires (...). Estos lugares están a distancias regulares uno de otro, hasta cerca de los Andes Anteriores, sobre el camino a Potosí, y proveen mudas de caballos a los mensajeros del gobierno así como a los viajeros particulares.\nAlexander Gillespie, Buenos Aires y el interior (publicado en 1818, el libro narra el viaje del capitán inglés Alexander Gillespie, que participó de la invasión inglesa de 1806 y una vez derrotado fue enviado prisionero al interior del país).", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": ""}, {"media_id": 1332, "titulo": "Llegando al Río Reconquista", "texto": "La ancha extensión ofrecía solamente unas pocas chozas míseras, habitadas por gente muy pobre, cuyo alimento consistía en carne, huevos, lecho y agua, sin pan o sal. Se veían ocasionalmente pequeñas plantaciones cuadradas que habían servido, al parecer, de reparos a algunos ranchitos, pero no había ningún vestigio para garantizar la conclusión de que eso hubiese alguna vez existido. Con el crepúsculo los aspectos y las actitudes de nuestra desparramada retaguardia eran a la vez risibles y lastimosos. Uno se sentaba como mujer y otro doblado, mostrando todas las flaquezas de la edad, mientras un tercero casi desecho se había desmontado, acostándose sobre el suelo en desesperación. Había muchos síntomas visibles de patear, rodar, caer. A seis leguas de Buenos Aires cruzamos el río de las Conchas (HOY LLAMADO RÍO RECONQUISTA).\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Ituzaingó"}, {"media_id": 1333, "titulo": "Cruzando el Río Reconquista", "texto": "Las provincias argentinas no tienen oro medio de tránsito que no sean las carretas de bueyes, para cuya fabricación existen importantes talleres en Tucumán. A pesar de la buena calidad de la madera usada en este tipo de vehículos, y de la solidez de su construcción, no duran más de dos años, debido a la tosquedad de los caminos y a la acción alternada del sol y la lluvia a que se ven incesantemente expuestos. Lo fatigoso de este modo de transporte puede juzgarse por el hecho de que una carreta sólo puede hacer cuatro viajes de Buenos Aires a Salta en dos años: dos de ida y dos de regreso; o, en el lenguaje del país, dos viajes redondos (...) Por lo general estas expediciones se hacen en caravanas o tropas de catorce carretas, cada una de las cuales, con una capacidad de unos mil setecientos kilos, es arrastrada por seis bueyes y necesita, además, varias yuntas de recambio (...) Las dificultades que se encuentran son muy grandes. Lluvias, huracanes y tormentas de polvo atacan a la caravana (...) Pero las principales dificultades son los ríos, para cruzar los cuales no hay puentes. A veces es necesario descargar todo el cargamento y llevar los bueyes a nado hasta la otra orilla, en tanto que os hombres hacen flotar sus carretas y transportan las mercancías en pelotas o balsas de cuero, o si la corriente es demasiado intensa, esperan durante días y semanas, al lado del río, hasta que la correntada ha disminuido. \nWilliam Mac Cann, Viaje a caballo por las provincias argentinas (1853)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Ituzaingó"}, {"media_id": 1334, "titulo": "Ruta 7 a la altura de Morón", "texto": "Como no había puestos de ayuda en la ruta cada uno echaba mano de lo que tenía para ayudar. En mi caso era una tía que vivía en Morón, “la tía ñata”, Amelia de los Ángeles Lebozo de Corradi. Parábamos en su casa, muy grande, con un gran parque, en la calle república oriental del Uruguay y Ntra. Sra. Del Buen Viaje; ¡parecía un centro de refugiados! Por lo menos la invadíamos cerca de 70 jóvenes. Como ella era muy proactiva en la parroquia de la catedral de Morón, se puso en contacto con varias comunidades parroquiales y conocidos a lo largo de la ruta 7, y éstas, a su vez, con los vecinos frentista de la ruta o cercanos a ella. Estos samaritanos dejaban pasar a las mujeres al baño y otras necesidades que iban surgiendo; hasta hubo un pastor de una iglesia Cristina Evangélica que en Merlo nos prestó sus instalaciones, dado que estaba cerca de la ruta. Hoy, que vivimos en una sociedad individualista, estas actitudes serían extrañas y yo diría casi impensables.\nDi Fazio, “La historia de la peregrinación a Luján: las anécdotas de los primeros años y cómo empezaron a marchar los jóvenes” (2024)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Moreno"}, {"media_id": 1335, "titulo": "General Rodríguez", "texto": "Desde General Rodríguez a Luján la ruta solo era oscuridad. Ver el puente de los “Tres arcos” (el conocido por la jerga de los peregrinos como el “puente blanco” dado en aquella época estaba pintado de blanco refulgente) de la ruta nacional 5 que cruza la ruta 7 y la rotonda de Luján era el claro indicio que la basílica estaba ahí a unos pasos. Ya se veían los pináculos de la iglesia, pero cada vez se alejaba más, parecía que tenía rueditas y a cada paso nuestro el templo se alejaba de la misma manera. Pero esa horrible apreciación culminaba cuando de improviso, surgía de golpe en su imponencia la Basílica, dado que llegábamos a ella por la calle San Martín. Ante esa visión espectacular del templo desaparecía el cansancio. Y ahí, dentro de su casa, estaba María, es decir, su imagen que nos la recuerda.\nGerardo Di Fazio, “La historia de la peregrinación a Luján: las anécdotas de los primeros años y cómo empezaron a marchar los jóvenes” (2024)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "General Rodríguez"}, {"media_id": 1336, "titulo": "Llegando a Luján", "texto": "El general Beresford y los oficiales, que iban bien montados, llegaron a Luján a las 4 pm, otros a las 7, con el aspecto más lamentable a causa del polvo y la fatiga, y en lo tocante a mi fueron las 11 de la noche antes de que llegase, aunque la torre de la villa se veía y parecía cercana cinco horas antes. Todos teníamos alojamiento con los habitantes y fuimos bien tratados por todas las criaturas del pueblo exceptuando las pulgas, que demostraron gran parcialidad por la sangre inglesa y total falta de sentimiento por nuestros cuerpos cansados. La mañana siguiente examinamos este lugar que contiene más de doscientas casas, de las que no más de tres son de altos, y las calles, si merecen ese nombre, corren en ángulos rectos y son muy angostas. Las construcciones son de barro, pero la iglesia es hermosa, con una especia de cúpula y por fuera semejante a las capillas de nuestro país (...). Hay, además, un Cabildo que se convirtió en alojamiento del general Beresford y los oficiales que permanecieron con él.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Luján"}, {"media_id": 1337, "titulo": "Luján", "texto": "La primera peregrinación masiva a Luján tuvo lugar el 3 de diciembre de 1871. Fue convocada como desagravio por la injusta cautividad que el Papa Pío IX sufría en Roma y como agradecimiento por el cese del flagelo de la fiebre amarilla en Buenos Aires. Uno de los entusiastas peregrinos fue el joven padre Salvaire, quien apenas un par de meses antes había llegado a Argentina desde su Francia natal. En su libro Historia de Nuestra Señora de Luján nos cuenta la honda emoción que le provocó ver la cantidad de exvotos que había en el camarín y cómo supo leer en esas ofrendas la historia de amor entre la Virgen de Luján y el pueblo al que le dedicaría su vida. También nos transcribe una detallada crónica de ese día escrita por un “testigo ocular” (probablemente él mismo). Leamos unos breves fragmentos para hacernos una idea de lo que fueron esas primeras peregrinaciones: “Por la mañana de ese día memorable, un sol resplandeciente y un ambiente templado nos auguraron un día hermoso (...) El Directorio del ferrocarril del Oeste, con un tino y una discreción superior a todo encomio, había tenido a bien poner a disposición de los peregrinos de la Capital, un tren especial”.\nEnrique Ciro Bianchi, Las peregrinaciones a Luján en la historia (2022)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Luján"}, {"media_id": 1338, "titulo": "Cruzando el río Luján", "texto": "(EN LA BASÍLICA DE LUJÁN) se guarda la venerada imagen, sobre la que se cuenta la siguiente tradición: llevaban de Buenos Aires a Chile, por el camino a través del país, dos imágenes en talla de la Virgen cuando, de pronto, el carro donde viajaba una de ellas empezó a encontrar obstáculos en el camino y al fin se rompió en las proximidades del río Luján. Este accidente fue considerado milagroso, creyéndose que la Virgen se rehusaba a cruzar la corriente. Entonces resolvieron erigir una iglesia en los márgenes del arroyo.  \nWilliam Mac Cann, Viaje a caballo por las provincias argentinas (1853)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Luján"}, {"media_id": 1339, "titulo": "Salto", "texto": "En lados opuestos (...) se hallan la iglesia y el fuerte; la primera sencilla y el último (...) con dos de sus frentes levantados con tierra endurecida sacada del lecho del río y los otros protegidos por un foso y palizadas. Once cañones de hierro y pedreros estaban emplazados en estado ruinoso y había cuarteles anexos en condición análoga. La fuerza militar destinada a su defensa, si efectiva, consistía en un capitán primero y otro segundo, con cincuenta hombres que siempre eran criollos. Pero este puesto de frontera no hubiera resistido a cincuenta hombres decididos ni veinte minutos, mucho menos a esas incursiones repentinas de huestes indianas, contra que era barrera (...). Los objetos principales de esas guardias eran traficar y contrabandear donde podían, sea con sus paisanos errantes o con los indios vecinos, que tres veces entraron en el pueblito de Salto mientras estábamos allí para trocar sus mercaderías.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Salto"}, {"media_id": 1340, "titulo": "Saliendo de Salto y llegando a Rojas", "texto": "Temprano estaban listas las carretas en el llano abajo del pueblo, pero no nos movimos hasta después del mediodía y no habíamos marchado más de cinco millas cuando hicimos alto para pasar la noche en la orilla de un río. Sesenta oficiales con sus asistentes, además de los prisioneros mercantiles que recientemente se nos habían unido, formaban en total un cuerpo de más de doscientos que, con una escolta de cien soldados y cuarenta y nueve carretas, alargaba nuestra línea de marcha más de dos millas y retardaba nuestro avance por aquellas barrancas que con tanta frecuencia cortan el campo (...). Al aclarar el 31 de marzo (DE 1807) cruzamos el río y llegamos a dos leguas del pueblo de Rojas, que está a once de Salto, a las siete de la tarde, llegando al primero al mediodía del 1° de abril. En esos días el campo se hizo más desigual y el pasto, de naturaleza más juncosa (...). El pueblo de Salto es más chico que el de Salto, pero las casas están en mejor condición y más lindas huertas las rodean. Ladrillos de barro endurecidos al sol componen sus habitaciones y su manera de techarlas con paja era al mismo tiempo sencilla e ingeniosa (...). El pueblo está sobre un río que es la frontera estipulada entre españoles e indios, cuya letra estricta hubiera autorizado actos hostiles contra cualquiera que intentase cruzarlo, pero los primeros no se refrenaban de tal transgresión. El pueblo está en el camino que lleva a Córdoba por el país de las Pampas, y aunque tan inmediatamente expuesto a invasiones el fuerte estaba en el mismo estado ruinoso que el de Salto. \nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Salto"}, {"media_id": 1341, "titulo": "Saliendo de Rojas hacia Melincué", "texto": "Permanecimos en Rojas hasta el 7 de abril (...) y por la tarde del 8 de abril llegamos al fortín Mercedes, a doce leguas de Rojas, donde había montados dos cañones de hierro y era notable solamente por un mirador, de unos cincuenta pies de alto, de donde los ojos podían llegar al máximo sin ver otra señal que de pasto o yuyos. Era para guardar de los ataques súbitos de los indios, y un cabo con cuatro hombres eran sus únicos defensores. Marchando hasta medianoche desuncimos en un ancho matorral, después de haber pasado una gran laguna y corrido hasta cansarlos a varias gamas y armadillos durante el día. En esta estación los fuegos distantes de los indios producían un efecto sorprendente, pues eran interminables a la vista debido a la sequedad del pasto.  Salimos el 9 temprano y al ponerse el sol descansábamos a una legua del fortín Melincué, que alcanzamos la mañana siguiente. \nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Wheelwright"}, {"media_id": 1342, "titulo": "Melincué", "texto": "(EL FORTÍN DE MELINCUÉ) solamente tenía un cañón y siete ranchos de barro. Un edificio, con pretensiones de iglesia pero destechado, también está cerca y se celebraba un el culto de un de los ranchitos. La situación es, sin embargo, muy pintoresca, ubicado sobre una laguna de diez millas de ancho y veinte de circunferencia, con agua que se acerca a salada y fondo endurecido. Gran número de cisnes con cabeza y pescuezo negros y cuerpo blanco se veían, cuyo plumón y alas son objeto de comercio, al lado de variedad de pájaros con el más lindo plumaje. El fortín podría haberse aislado del lago a satisfacción, y en él estaban apostados un cabo con cinco milicos.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Melincué"}, {"media_id": 1343, "titulo": "De Saladillo a Bell Ville", "texto": "Salimos el 18 al venir el día y en tres horas llegamos a Saladillo, donde había cuatro ranchos, una capilla y un fortín en ruinas. Aquí un riacho entra en el Tercero, y después de una marcha sin interés descansamos en los campos por la noche. Al venir el día 19 vimos Los Cóndores a treinta leguas, una sierra de cerros altos que se extiende noventa millas en rumbo sur de Córdoba. Nada era notable, excepto el terreno interpuesto en nuestro camino a Fraile Muerto (BELL VILLE), adonde llegamos a las 8 de la noche. Se llamó así a ese pueblo por haber sido asesinado un fraile en el paraje por los indios que se ocupaba de convertir. Aquí se interpone un lindo monte que, sin interrupción, llega hasta Córdoba, a cuya vera se levanta el pueblo, de unas veinte casas, con un cuartel fortificado, con troneras para mosquetería y una iglesia muy hermosa. El río Tercero aquí es muy correntoso, debido a los declives cerca del lugar, y su cauce se compone de guijarros y granito en descomposición.\nAlexander Gillespie, Buenos Aires y el interior (1818)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Saladillo"}, {"media_id": 1344, "titulo": "De Saladillo hacia Córdoba", "texto": "Cuando llegamos al primer río, llamado Saladillo, noté la acción del fuego sobre sus orillas en época remota. La sólida marga del cauce está mezclada con conchas calcinadas. Pasando Barrancas el viajero, seis leguas más adelante, llega a Fraile Muerto (BELL VILLE), donde comienza la subida. Las postas son regulares y la mirada se alivia de la penosa y negra uniformidad de las pampas. El follaje del monte alegra los ojos. La naturaleza aumenta en belleza a medida que continúa la ascención y se presenta un variado y rico espectáculo. Pronto cambia esta variada perspectiva en denso matorral que se mantiene casi todo el camino hasta Córdoba, salvo en la vecindad del río Tercero y de otros arroyos que lo interceptan. En el paso de Ferreira, cuando bajamos la cuesta, se nos previno de alguna dificultad y peligro con un grito en no ordinario tono de voz. Los muchachos gauchos sujetaron el momento y cuando bajamos la ventanilla para inquirir de dónde procedía el grito se introdujo en el carruaje la cabeza de un negro de dimensiones gigantescas y repugnante fealdad (...) El africano montaba una mula, completamente desnudo (...) Al principio fue difícil comprender lo que quería, tan furioso y ensordecedor era ruido que hacía, pero por fin comprendimos que, como el río que teníamos por delante era correntoso y estaba crecido, había venido a ofrecernos su ayuda para vadearlo. No obstante esto, sus gestos y vociferaciones parecían de maniático, y cuando arrimó el hombro a las ruedas su simple esfuerzo parecía más eficaz para hacerlas mover que el rebenque y el espolear de todos nuestros peones (...) Su fuerza y fama pueden juzgarse por su fama en la plaza de toros de Córdoba donde, según oímos después, frecuentemente cansaba a los toros más bravos saltándoles al lomo y quedando tan firmemente sentado que, siendo en vano todos los esfuerzos del animal furiosos para deshacerse de la carga, por in se desplomaba cansado debajo del hercúleo jinete.\nJoseph Andrews, Viaje de Buenos Aires a Potosí y Arica (1825)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Bell Ville"}, {"media_id": 1345, "titulo": "Saliendo de Oncativo", "texto": "(Llegamos a) Oncativo, la estación terminal, y desde ese punto nos trasladamos en mensajería a la docta ciudad de Córdoba (...) Viajar en mensajería era para mí una locomoción tan novedosa como divertida y llena de emociones. En un mail-coach o galera del tiempo colonial, de altas ruedas y un ancho adaptado a la huella, a lo que se reducían en esa época los caminos que cruzaban las vastas llanuras, se sentaban de seis a ocho pasajeros que, oprimidos, seguían el vaivén del pesado vehículo, siempre expuestos a chocar unos con otros. El conductor, con la corneta en la mano, ocupaba el pescante con algún pasajero que prefería respirar el aire libre al comprimido y a veces sofocante del interior de la galera. Tiraba el coche dos caballos de tronco, cada uno con su jinete o postillón, de cuya destreza dependía con frecuencia la vida de los pasajeros (...) Procedían dos o tres yuntas de cuarteadores tirando de un grueso torzal atado al eje y montados por otros tantos postillones que, cuando el camino y los caballos o las mulas, a veces chúcaras, lo permitían, imprimían al coche una velocidad capaz de asustar al más sereno, por los barquinazos continuos a que estaban expuestos los pasajeros enjaulados. Esto, sin embargo, no era lo peor de la jornada, que con frecuencia terminaba en una mísera posta donde los pasajeros tenían que reñir con las vinchucas y a veces, por toda cena, conformarse con las provisiones que una esposa previsora pusiera en el coche al partir.\nCarlos Christiernsson, Recuerdos de 42 años en la República Argentina (El libro fue publicado en 1910, el fragmento refiere a un viaje de Buenos Aires a Tucumán que Christiernsson, ingeniero sueco de Ferrocarriles, realizó entre 1868 y 1870)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Oncativo"}, {"media_id": 1346, "titulo": "Toledo (unos kilómetros antes de entrar a la ciudad de Córdoba)", "texto": "Tres leguas antes de entrar a Córdoba da principio el espeso monte hasta concluir su jurisdicción. De sus cercanías se provee la ciudad de leña seca en carretillas, que vale cada una cuatro reales, que es suficiente para el gasto de un mes en una casa de regular economía. También se sacan del interior del monte palos para techar las casas y fábrica de varios muebles.\nConcolorcorvo, El lazarillo de ciegos caminantes (1771)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Toledo"}, {"media_id": 1347, "titulo": "Llegando a la ciudad de Córdoba I", "texto": "El viajero que se acerca a Córdoba busca y no encuentra en el horizonte la ciudad santa, la ciudad mística, la ciudad con capelo y borlas de doctor. Al fin, el arriero le dice: “Vea ahí abajo, entre los pastos...” Y en efecto: fijando la vista en el suelo, y a a corta distancia, vense asomar una, dos, tres, diez cruces seguidas de cúpulas y torres de los muchos templos que decoran esta Pompeya de la España de la media edad.\nDomingo Faustino Sarmiento, Facundo (1845)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Córdoba"}, {"media_id": 1348, "titulo": "Llegando a la ciudad de Córdoba II", "texto": "Los viajes ordinarios se hacen en carretas, como lo hicimos nosotros. La carreta es una especia de carro que en parte conviene con nuestro biroccio, en parte con los carretones romanos y en parte ni con unos ni con otros. Encima hay un tablado bien hecho con tablas gruesas, ancho y largo que pueden servir cómodamente de cama para una persona y tenga espacio para el asiento de tres por cada lado. Bajo el techo se ponen las provisiones, los cofres, los líos y los paquetes se ponen afuera y sirven para sentarse encima (...) La carreta tiene la puerta o entrada detrás y se entra con una escalera que se alza cuando camina. Toda esta máquina está puesta y equilibrada sobre dos grandes ruedas mayores que los carretones romanos y es tirada siempre por cuatro bueyes. \nCuarenta y cinco fuera las carretas que nos condujeron a Córdoba, llevando cincuenta y ocho jesuitas, pues en una pueden dormir cómodamente dos personas si sobre el lugar en que se colocan los baúles se pone otro colchón (...). Dividíanse las cuarenta y cinco carretas en tres escuadras. Cada una de estas venía separada de la otra una media milla (...). Detrás de cada escuadra venía una gran tropa de bueyes y caballos, los primeros para dar muda a las carretas y la mantención durante el camino, los otros para la gente de servicio que nos acompañaba y que a caballo cuidaba los bueyes sueltos que no se apartasen de las carretas.\n(...) Llegados en la tarde del 27 (DE JULIO DE 1729) a media milla de Córdoba dormimos en nuestras carretas como las noches anteriores. La mañana del 28, después que dijo la misa el Padre Provincial que venía con nosotros, nos encaminamos a pie, poco a poco, hacia la ciudad (...) Entramos a la ciudad al son de las campanas, seguidos de todo el pueblo, y nos dirigimos directamente a nuestra iglesia, donde encontramos esperándonos al señor Obispo (...). Empleamos en el camino un mes, ni más ni menos, pues partimos de Buenos Aires el 25 de junio, a pie, a una posesión que tiene aquel colegio, distante cinco millas de la ciudad. Nos detuvimos allí hasta el 28 para ordenar las carretas y proveernos de la leña que bastase hasta que encontráramos más. El mismo día después de comer, se empezó el viaje, y el 28 entramos a Córdoba, haciéndose por lo general quince millas diarias de camino.\nPadre Carlos Gervasoni, Carta del Padre Gervasoni al señor Angelino Gervasoni, su hermano (1729)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Córdoba"}, {"media_id": 1349, "titulo": "Córdoba", "texto": "A mi tránsito se estaban vendiendo en Córdoba dos mil negros (...) todos negros puros y criollos hasta la cuarta generación, porque los regulares vendían todas aquellas criaturas que salían con mezcla de español, mulato o indio. Entre la multitud de negros hubo muchos músicos y de todos los oficios, y se procedió a la venta por familias. Me aseguraron que sólo las religiosas de Santa Teresa tenían una ranchería de trescientos esclavos de ambos sexos a quienes dan sus raciones de carne y vestidos de las burdas telas que trabajan (...) Mucho menor es el número que hay en las demás religiones, pero hay casa particular que tiene treinta y cuarenta, de la que la mayor parte se ejercitan en varias granjerías de que resulta una multitud de lavanderas excelentes.\nConcolorcorvo, El lazarillo de ciegos caminantes (1771)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Córdoba"}, {"media_id": 1350, "titulo": "Saliendo de la ciudad de Córdoba I", "texto": "En la ancha faja de más de cien kilómetros de travesía que existe entre Córdoba y Santiago del Estero no hay agua potable, y en consecuencia hubo que traerse agua para la expedición, en barriles, a lomo de mula... El que cruza las salinas y la travesía a razón de veinte kilómetros por hora no puede formarse una idea de lo que cuesta atravesar esa zona desheredada de la naturaleza, a pie, con algunos centímetros de barro bajo la capa blanca de salitre que le imprime el aspecto de un gran lago de invierno en el norte de Europa con su capa de nieve. \nCarlos Christiernsson, Recuerdos de 42 años en la República Argentina (El libro fue publicado en 1910, el fragmento refiere a un viaje de Buenos Aires a Tucumán que Christiernsson, ingeniero sueco de Ferrocarriles, realizó entre 1868 y 1870)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Estación Juárez Celman"}, {"media_id": 1351, "titulo": "Saliendo de la ciudad de Córdoba II", "texto": "Las postas consistían ordinariamente en uno o más ranchos con corral, pozo (donde había agua subterránea) y otras dependencias, todo generalmente cercado por un gran foso con puente levadizo para estar a cubierto de las invasiones de los indios cuando se trataba de parajes despoblados (...) El tiempo mínimo que se empleaba en estos viajes era (...) seis días de Córdoba a Santiago, uno y medio de Santiago a Tucumán.\nEduardo y Gabriel Carrasco, Las primeras mensajerías (1854)", "hora": 12.0, "keypoint": 156.52173913043478, "municipio": "Estación General Paz"}];
(function(){
  function hhmm(h){
    if (h == null || isNaN(h)) return '';
    var hi = Math.floor(h);
    var mi = Math.round((h - hi) * 60);
    if (mi === 60) { mi = 0; hi += 1; }
    if (hi === 24) hi = 0;
    return ('0' + hi).slice(-2) + ':' + ('0' + mi).slice(-2);
  }
  var params = new URLSearchParams(location.search);
  var t0 = parseFloat(params.get('t0'));
  var loopSecs = parseFloat(params.get('loop_secs'));
  var conReloj = isFinite(t0) && isFinite(loopSecs) && loopSecs > 0;
  var cont = document.getElementById('textos');
  var NODOS = [];
  TEXTOS.forEach(function(tx){
    var card = document.createElement('div');
    card.className = 'texto-card';
    var tit = document.createElement('div'); tit.className = 'titulo';
    var horaEl = document.createElement('span'); horaEl.className = 'hora';
    horaEl.textContent = hhmm(tx.hora) + ' ';
    tit.appendChild(horaEl);
    tit.appendChild(document.createTextNode(tx.titulo || ''));
    if (tx.municipio) {
      var lugar = document.createElement('span'); lugar.className = 'lugar';
      lugar.textContent = ' \u00b7 ' + tx.municipio;
      tit.appendChild(lugar);
    }
    var cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
    cuerpo.textContent = tx.texto || '';
    card.appendChild(tit);
    card.appendChild(cuerpo);
    cont.appendChild(card);
    NODOS.push(card);
  });
  var actual = -1;
  function indiceActual(){
    if (TEXTOS.length === 0) return -1;
    if (conReloj) {
      // Un texto a la vez: slots de igual duración en orden de ruta; el loop
      // avanza y el texto activo rota a un ritmo estable.
      var t = ((Date.now() - t0) / 1000) % loopSecs;
      var slot = loopSecs / TEXTOS.length;
      return Math.floor(t / slot) % TEXTOS.length;
    }
    // Preview (sin ?t0): rota cada 6 s para mostrar el comportamiento.
    return Math.floor((Date.now() / 1000) / 6) % TEXTOS.length;
  }
  function pintar(){
    var idx = indiceActual();
    if (idx < 0) return;
    if (idx !== actual) {
      if (actual >= 0 && NODOS[actual]) NODOS[actual].classList.remove('visible');
      NODOS[idx].classList.add('visible');
      actual = idx;
    }
  }
  setInterval(pintar, 250);
  pintar();
})();
</script>
